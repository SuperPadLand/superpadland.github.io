{{- /* Bandera pequeña del selector de idioma (decorativa: el código ES/GL va al lado) */ -}}
{{- if eq . "es" -}}
<svg class="bandeira" viewBox="0 0 3 2" width="18" height="12" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><rect width="3" height="2" fill="#AA151B"/><rect y=".5" width="3" height="1" fill="#F1BF00"/></svg>
{{- else if eq . "gl" -}}
<svg class="bandeira" viewBox="0 0 3 2" width="18" height="12" aria-hidden="true" focusable="false"><rect width="3" height="2" fill="#FFFFFF"/><line x1="0" y1="0" x2="3" y2="2" stroke="#0099CC" stroke-width=".5"/></svg>
{{- end -}}
