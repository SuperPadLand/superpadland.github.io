baseURL = "https://superpadland.github.io/"
defaultContentLanguage = "es"
# El castellano va en la raíz; el gallego en /gl/
defaultContentLanguageInSubdir = false
title = "SuperPadLand"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

# Reescribe rutas relativas a la raíz (/img/...) anteponiendo el baseURL.
# Hace que las imágenes funcionen tanto en dominio propio como en subcarpeta.
canonifyURLs = true

# Quita las tildes de las direcciones: /categories/articulos/ en vez de /categories/art%C3%ADculos/
removePathAccents = true

[pagination]
  pagerSize = 12

[minify]
  disableXML = true
  minifyOutput = true

# --- Taxonomías ------------------------------------------------------------
[taxonomies]
  consola = "consolas"
  categoria = "categories"
  tag = "tags"

# --- Salidas (la home también en JSON para el buscador) --------------------
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Permite ficheros de contenido .html (las entradas migradas de WordPress son HTML).
[security]
  allowContent = ['.*']

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

# --- Idiomas: castellano (raíz) y gallego (/gl/) ---------------------------
# El contenido gallego está en content-gl/, con las mismas rutas que content/:
# así cada página sabe cuál es su traducción.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
    sites = { matrix = { languages = ["es"] } }
  [[module.mounts]]
    source = "content-gl"
    target = "content"
    sites = { matrix = { languages = ["gl"] } }

[languages]
  [languages.es]
    weight = 1
    label = "Castellano"
    locale = "es-ES"
    title = "SuperPadLand"
    [languages.es.params]
          images = ["/img/superpadland-compartir.png"]
    [[languages.es.menus.main]]
      identifier = "consolas"
      name = "Consolas"
      url = "/consolas/"
      weight = 10
    [[languages.es.menus.main]]
      identifier = "blog"
      name = "Blog"
      url = "/blog/"
      weight = 20
    [[languages.es.menus.main]]
      identifier = "chuletas"
      name = "Chuletas retro"
      url = "/chuletas-retro/"
      weight = 30
    [[languages.es.menus.main]]
      identifier = "buscar"
      name = "Buscar"
      url = "/search/"
      weight = 40
    [[languages.es.menus.main]]
      identifier = "acerca"
      name = "Acerca de"
      url = "/acerca-de/"
      weight = 50

  [languages.gl]
    weight = 2
    label = "Galego"
    locale = "gl-ES"
    title = "SuperPadLand"
    [languages.gl.params]
      description = "Os mellores rankings de xogos de cada consola retro, probados en hardware real."
      images = ["/img/superpadland-compartir-gl.png"]
    [[languages.gl.menus.main]]
      identifier = "consolas"
      name = "Consolas"
      url = "/consolas/"
      weight = 10
    [[languages.gl.menus.main]]
      identifier = "blog"
      name = "Blog"
      url = "/blog/"
      weight = 20
    [[languages.gl.menus.main]]
      identifier = "chuletas"
      name = "Chuletas retro"
      url = "/chuletas-retro/"
      weight = 30
    [[languages.gl.menus.main]]
      identifier = "buscar"
      name = "Buscar"
      url = "/search/"
      weight = 40
    [[languages.gl.menus.main]]
      identifier = "acerca"
      name = "Acerca de"
      url = "/acerca-de/"
      weight = 50

# --- Parámetros del tema PaperMod -----------------------------------------
[params]
  env = "production"
  description = "Los mejores rankings de juegos de cada consola retro, probados en hardware real."
  author = "SuperPadLand"
  mainSections = ["posts"]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = true
  TocOpen = false
  ShowWordCount = false
  hidemeta = false
  disableThemeToggle = false
  DateFormat = "2 de January de 2006"
  comments = true
  # La imagen al compartir en redes va en cada idioma (languages.*.params.images)

  # Verificación de Google Search Console
  [params.analytics.google]
    SiteVerificationTag = "g0t5IgPL7uYtVTd2uJ3v69LyjrpTwrk2GgoPiGBLQaE"

  # La portada solo en listados: dentro de la entrada el logo ya abre el texto
  [params.cover]
    hiddenInSingle = true

  [params.assets]
    disableHLJS = true
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16.png"
    favicon32x32 = "/favicon-32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/favicon.svg"

  # Comentarios con giscus: se guardan en las Discusiones del repositorio
  [params.giscus]
    repo = "SuperPadLand/superpadland.github.io"
    repoId = "R_kgDOS51nYA"
    categoria = "Announcements"
    categoriaId = "DIC_kwDOS51nYM4DKFK0"

  # Buscador (Fuse.js, integrado en PaperMod): busca en toda la entrada y en cada juego de los tops
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    ignoreLocation = true
    threshold = 0.3
    minMatchCharLength = 2
    limit = 40
    keys = [{ name = "title", weight = 3 }, { name = "content", weight = 1 }]
